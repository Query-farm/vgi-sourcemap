[package]
name = "sourcemap-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "VGI worker that decodes JavaScript Source Map v3 (.map) files and resolves minified positions back to original source locations in DuckDB over Apache Arrow"

[lib]
name = "sourcemap_worker"
path = "src/lib.rs"

[[bin]]
name = "sourcemap-worker"
path = "src/main.rs"

[dependencies]
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-schema.workspace = true
# The Sentry `sourcemap` crate (BSD-3-Clause) does the heavy lifting: Base64-VLQ
# `mappings` decode, index maps (`sections`), inline `sourcesContent`, and the
# nearest-preceding `lookup_token` binary search. We never reimplement any of it.
sourcemap = "9"
log = "0.4"

# --- Native ---------------------------------------------------------------
# The SDK's HTTP transport plus the HTTP RPC transport and env_logger. The SDK's
# `sqlite` feature is deliberately NOT enabled: this worker keeps no state, so the
# SDK's scratch store falls back to its filesystem backend, and the shipped binary
# carries no bundled C SQLite (RUSTSEC-2026-0459 hits libsqlite3-sys 0.37, which
# vgi 0.50's rusqlite 0.39 pins).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vgi = { workspace = true, features = ["transport-http"] }
vgi-rpc = { workspace = true, features = ["http"] }
env_logger = "0.11"

# --- wasm32 ---------------------------------------------------------------
# No sqlite (C) and no HTTP transport (tokio/mio/axum); the bincode stream codec
# is what the SAB byte-channel transport needs. env_logger is native-only (the
# browser build logs via emscripten's stderr shim).
[target.'cfg(target_arch = "wasm32")'.dependencies]
vgi = { workspace = true }
vgi-rpc = { workspace = true, features = ["stream-codec"] }

[dev-dependencies]
# Property-based fuzzing that the decoder never panics on arbitrary/truncated input.
proptest = "1"
